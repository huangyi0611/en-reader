<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="英读">
<link rel="apple-touch-icon" href="icon.svg"><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b6ea5"><title>英语阅读助手</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script></head><body>
<header><b>英读</b><select id="docSel"></select><button id="btnImport">导入</button><button id="btnSet">设置</button></header>
<main id="main">
 <section id="reader"><div id="empty">点击「导入」粘贴英文、上传 .txt / .epub，或通过 ?text= 链接传入文本。</div></section>
 <aside id="side"><nav><button data-tab="syntax" class="on">长句句式</button><button data-tab="slang">俚语解释</button><button data-tab="phrase">短语搭配</button></nav>
 <div id="sideBody">点击左侧任一句子进行分析。</div></aside>
</main>
<div id="hlBar" hidden><button data-c="y" class="c y"></button><button data-c="g" class="c g"></button><button data-c="b" class="c b"></button><button data-c="p" class="c p"></button><button data-c="u">下划线</button><button data-c="x">清除</button></div>
<div id="pop" hidden></div>
<dialog id="dlgImport"><h3>导入文本</h3><input id="title" placeholder="标题（可选）"><textarea id="paste" rows="8" placeholder="在此粘贴英文…"></textarea>
<p><input type="file" id="file" accept=".txt,.epub,text/plain,application/epub+zip"></p><p id="impMsg"></p>
<div class="row"><button id="impOk">导入粘贴内容</button><button id="impDel">删除当前文档</button><button onclick="this.closest('dialog').close()">关闭</button></div></dialog>
<dialog id="dlgSet"><h3>设置（仅保存在本机）</h3>
<label>Base URL<input id="sBase"></label><label>模型<input id="sModel"></label><label>API Key<input id="sKey" type="password"></label>
<label><input type="checkbox" id="sDict"> 释义失败时使用 dictionaryapi.dev</label>
<div class="row"><button id="setOk">保存</button><button id="clrCache">清除缓存</button><button onclick="this.closest('dialog').close()">关闭</button></div></dialog>
<script src="app.js"></script></body></html>
