<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="英读">
<link rel="apple-touch-icon" href="icon.svg"><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b6ea5"><title>英语阅读助手</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script></head><body>
<header><b>英读</b><select id="docSel"></select><button id="btnImport" type="button">导入</button><button id="btnSet" type="button" aria-label="设置" title="设置"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.2 7.2 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.22-1.14.54-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.6.22l2.39-.96c.49.4 1.04.72 1.63.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.59-.22 1.14-.54 1.63-.94l2.39.96c.22.09.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg></button></header>
<main id="main">
 <section id="reader"><div id="empty">点击「导入」粘贴英文、上传 .txt / .epub，或通过 ?text= 链接传入文本。</div></section>
 <aside id="side"><nav><button data-tab="syntax" class="on">长句句式</button><button data-tab="slang">俚语解释</button><button data-tab="phrase">短语搭配</button></nav>
 <div id="sideBody">点击左侧任一句子进行分析。</div></aside>
</main>
<div id="hlBar" hidden><button data-c="y" class="c y"></button><button data-c="g" class="c g"></button><button data-c="b" class="c b"></button><button data-c="p" class="c p"></button><button data-c="u">下划线</button><button data-c="x">清除</button></div>
<div id="pop" hidden></div>
<dialog id="dlgImport"><h3>导入文本</h3><input id="title" placeholder="标题（可选）"><textarea id="paste" rows="8" placeholder="在此粘贴英文…"></textarea>
<p><input type="file" id="file" accept=".txt,.epub,text/plain,application/epub+zip"></p><p id="impMsg"></p>
<div class="row"><button id="impOk">导入粘贴内容</button><button id="impDel">删除当前文档</button><button onclick="this.closest('dialog').close()">关闭</button></div></dialog>
<dialog id="dlgSet"><h3>设置（仅保存在本机）</h3>
<label>服务商<select id="sPreset">
<option value="deepseek">DeepSeek</option>
<option value="openai">OpenAI</option>
<option value="siliconflow">硅基流动</option>
<option value="custom">自定义</option>
</select></label>
<label>Base URL<input id="sBase" spellcheck="false" autocomplete="off"></label>
<label>模型<input id="sModel" spellcheck="false" autocomplete="off" placeholder="模型名"></label>
<label>API Key<input id="sKey" type="password" spellcheck="false" autocomplete="off"></label>
<label><input type="checkbox" id="sDict"> 释义失败时使用 dictionaryapi.dev</label>
<p id="setMsg" class="mu"></p>
<div class="row"><button id="setOk" type="button">保存</button><button id="btnTest" type="button">测试连接</button><button id="clrCache" type="button">清除缓存</button><button type="button" onclick="this.closest('dialog').close()">关闭</button></div></dialog>
<script src="app.js"></script></body></html>
